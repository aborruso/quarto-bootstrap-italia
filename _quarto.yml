project:
  type: website
  output-dir: _site
  # solo le pagine .qmd: README e altri .md del progetto restano fuori dal sito
  render:
    - "*.qmd"

website:
  title: "Nome dell'Istituzione"
  search: true
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: Installazione e uso
        href: installazione.qmd
      - text: Amministrazione
        href: amministrazione.qmd
      - text: Servizi
        href: servizi.qmd
      - text: Novità
        menu:
          - text: Notizie
            href: notizie/index.qmd
          - text: Eventi
            href: eventi.qmd
      - text: Contenuti Quarto
        href: demo.qmd
  page-footer:
    center:
      - text: Media policy
        href: "#"
      - text: Note legali
        href: "#"
      - text: Privacy policy
        href: "#"
      - text: Mappa del sito
        href: "#"

# ciò che Quarto non prevede: lo legge il tema per l'intestazione e il piè di pagina
bootstrap-italia:
  ente:
    text: Ente di appartenenza
    href: "#"
  istituzione: Nome dell'Istituzione
  tagline: Sito di esempio in Quarto con Bootstrap Italia
  lingue:
    - lang: it
      text: ITA
      href: index.qmd
    - lang: en
      text: ENG
      href: "#"
  footer:
    - title: Contatti
      href: "#"
      text: |
        **Nome dell'Istituzione**\
        Via Roma 1 - 00100 Città\
        Codice fiscale / P. IVA: 00000000000
    - title: Amministrazione trasparente
      href: "#"
      links:
        - text: Albo pretorio
          href: "#"
        - text: Bandi e concorsi
          href: "#"
    - title: Seguici su
      href: "#"
      social:
        - icon: it-github
          text: Il progetto su GitHub
          href: https://github.com/aborruso/quarto-bootstrap-italia
        - icon: it-designers-italia
          text: Designers Italia
          href: "#"

lang: it

format:
  bootstrap-italia-html: default
