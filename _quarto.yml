project:
  type: website
  # solo le pagine .qmd: README e altri .md del progetto restano fuori dal sito
  render:
    - "*.qmd"

website:
  title: "Nome dell'ente"
  search: true
  # il menu, con la sintassi standard di Quarto
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: Notizie
        href: notizie/index.qmd
  # i link in fondo alla pagina
  page-footer:
    center:
      - text: Note legali
        href: "#"
      - text: Privacy
        href: "#"

# ciò che Quarto non prevede: lo legge il tema per l'intestazione e il piè di pagina
bootstrap-italia:
  istituzione: "Nome dell'ente"
  tagline: "Una frase che descrive l'ente"
  # l'ente di appartenenza, nella barra in alto
  # ente:
  #   text: Regione
  #   href: https://www.example.org
  # il logo: un'icona del design system o il percorso di un'immagine
  logo: it-pa
  # il selettore di lingua compare solo se ci sono lingue
  # lingue:
  #   - lang: it
  #     text: ITA
  #     href: index.qmd
  #   - lang: en
  #     text: ENG
  #     href: en/index.qmd
  footer:
    - title: Contatti
      text: |
        **Nome dell'ente**\
        Via Roma 1 - 00100 Città
    - title: Link utili
      links:
        - text: Amministrazione trasparente
          href: "#"

lang: it

format:
  bootstrap-italia-html: default
