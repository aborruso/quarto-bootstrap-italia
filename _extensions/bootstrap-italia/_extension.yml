title: Bootstrap Italia
author: Andrea Borruso
version: 0.2.0
quarto-required: ">=1.10.18"
contributes:
  formats:
    html:
      # il Bootstrap incluso da Quarto viene rimosso: lo stile arriva tutto da Bootstrap Italia
      theme: none
      toc: false
      # senza il tema di Quarto le formule non verrebbero convertite; MathML è
      # nativo nei browser e non richiede librerie esterne
      html-math-method: mathml
      anchor-sections: false
      date-format: long
      # l'etichetta dei riferimenti ai callout (@tip-uno), che Quarto non traduce
      language:
        crossref-nte-prefix: Nota
        crossref-tip-prefix: Suggerimento
        crossref-wrn-prefix: Attenzione
        crossref-cau-prefix: Avvertenza
        crossref-imp-prefix: Importante
      css:
        # Bootstrap Italia con i colori esposti come variabili CSS (--bi-…),
        # generato da scripts/genera-token.py
        - bootstrap-italia/css/bootstrap-italia-tokens.min.css
        - fonts.css
        - quarto-bootstrap-italia.css
      # senza il tema di Quarto il title block esce senza la classe che Quarto si
      # aspetta, e il post-processor ne crea un secondo dentro <main>
      template-partials:
        - partials/title-block.html
      shortcodes:
        # {{< icona it-file >}} al posto dell'SVG scritto a mano
        - bootstrap-italia-shortcodes.lua
      filters:
        # code-fold anche sui blocchi di codice scritti a mano, non solo sulle celle
        - at: pre-ast
          path: bootstrap-italia-code.lua
        # i callout di Quarto resi con il markup di Bootstrap Italia: gira dopo la
        # registrazione dei riferimenti incrociati, che così restano validi
        - at: post-quarto
          path: bootstrap-italia-callout.lua
        # JavaScript del design system, sprite delle icone, ricerca, raccordo del
        # markup dei componenti. Gira a valle di tutto: prima gli shortcode sono
        # ancora segnaposto e il markup non è quello definitivo.
        - at: post-quarto
          path: bootstrap-italia.lua
        # intestazione, menu e piè di pagina generati da _quarto.yml
        - at: post-quarto
          path: bootstrap-italia-chrome.lua
